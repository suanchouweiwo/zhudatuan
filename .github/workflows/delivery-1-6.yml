name: Delivery Control 1.7
run-name: ${{ inputs.request_id && format('Runner 1.7 [{0}]', inputs.request_id) || 'Runner 1.7' }} ${{ inputs.operation }} ${{ inputs.identifier || 'none' }} ${{ inputs.release_target || 'none' }} ${{ inputs.physical_node || 'none' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: One Runner 1.7 operation; use zdt-delivery for pre-core startup fallback
        required: true
        type: choice
        options: [release, status, retry, rollback]
      identifier:
        description: Full Source SHA or r16 release id; empty for rollback
        required: false
        type: string
      release_target:
        description: Optional fast exact release/retry target(s), comma-paired with physical node(s); required for rollback
        required: false
        type: string
      physical_node:
        description: Optional fast exact release/retry node(s), comma-paired with target(s); required for rollback
        required: false
        type: string
      instance_path:
        description: Optional public instance snapshot directory in the selected Source SHA
        required: false
        type: string
      execution_location:
        description: Internal startup fallback override
        required: false
        default: auto
        type: choice
        options: [auto, github-hosted]
      request_id:
        description: Internal command/run correlation only
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  route:
    name: Choose execution location
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      runs_on: ${{ steps.route.outputs.runs_on }}
      runner_class: ${{ steps.route.outputs.runner_class }}
      route_reason: ${{ steps.route.outputs.route_reason }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /04_tools/release-engine/select-runner-1-6.mjs
            /04_tools/release-engine/src/runner-selection-1-6.mjs
      - name: Resolve release identity
        id: identity
        env:
          OPERATION: ${{ inputs.operation }}
          IDENTIFIER: ${{ inputs.identifier }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          PHYSICAL_NODE: ${{ inputs.physical_node }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            release|status)
              if [[ "$IDENTIFIER" =~ ^[0-9a-f]{40}$ ]]; then source_sha="$IDENTIFIER"
              elif [[ "$IDENTIFIER" =~ ^r16-([0-9a-f]{40})$ ]]; then source_sha="${BASH_REMATCH[1]}"
              elif [ "$OPERATION" = status ] && [ -z "$IDENTIFIER" ]; then source_sha=''
              else echo 'release requires a full Source SHA or r16 release id; status accepts an optional identity' >&2; exit 64; fi
              if [ "$OPERATION" = release ] && { [ -n "$RELEASE_TARGET" ] || [ -n "$PHYSICAL_NODE" ]; }; then
                [ -n "$RELEASE_TARGET" ] && [ -n "$PHYSICAL_NODE" ] || { echo 'exact release requires both target and physical node' >&2; exit 64; }
              fi
              ;;
            retry)
              [[ "$IDENTIFIER" =~ ^r16-([0-9a-f]{40})$ ]] || { echo 'retry requires an r16 release id' >&2; exit 64; }
              source_sha="${BASH_REMATCH[1]}"
              if [ -n "$RELEASE_TARGET" ] || [ -n "$PHYSICAL_NODE" ]; then
                [ -n "$RELEASE_TARGET" ] && [ -n "$PHYSICAL_NODE" ] || { echo 'exact retry requires both target and physical node' >&2; exit 64; }
              fi
              ;;
            rollback)
              [ -n "$RELEASE_TARGET" ] && [ -n "$PHYSICAL_NODE" ] || { echo 'rollback requires target and physical node' >&2; exit 64; }
              source_sha=''
              ;;
          esac
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Observe self-hosted runners
        id: observe
        if: ${{ inputs.execution_location != 'github-hosted' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            printf '{"error":"runner-read-token-missing"}\n' > "$RUNNER_TEMP/runners.json"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runners" > "$RUNNER_TEMP/runners.json"
      - name: Select portable runner or GitHub Hosted
        id: route
        shell: bash
        run: |
          if [ "${{ inputs.execution_location }}" = github-hosted ]; then
            route='{"runsOn":["ubuntu-24.04"],"runnerClass":"github-hosted","reason":"pre-core-startup-fallback"}'
          else
            if [ "${{ steps.observe.outcome }}" != success ]; then printf '{"error":"runner-status-unavailable"}\n' > "$RUNNER_TEMP/runners.json"; fi
            route="$(node 04_tools/release-engine/select-runner-1-6.mjs "$RUNNER_TEMP/runners.json")"
          fi
          echo "runs_on=$(node -e 'const r=JSON.parse(process.argv[1]);process.stdout.write(JSON.stringify(r.runsOn))' "$route")" >> "$GITHUB_OUTPUT"
          echo "runner_class=$(node -e 'const r=JSON.parse(process.argv[1]);process.stdout.write(r.runnerClass)' "$route")" >> "$GITHUB_OUTPUT"
          echo "route_reason=$(node -e 'const r=JSON.parse(process.argv[1]);process.stdout.write(r.reason)' "$route")" >> "$GITHUB_OUTPUT"

  execute:
    name: Execute on ${{ needs.route.outputs.runner_class }}
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    timeout-minutes: 40
    outputs:
      core_started: ${{ steps.started.outputs.value }}
    env:
      ZDT_ARTIFACT_STORE: ${{ vars.ZDT_ARTIFACT_STORE || 'r2' }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ inputs.operation == 'status' }}
        with:
          ref: ${{ github.sha }}
          path: .runner-1-6/status-control
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/runner-1-6/
            /02_platform_pingtai/infrastructure/release/
            /04_tools/release-engine/
            /scripts/runner-1-6.sh
      - uses: actions/checkout@v6
        if: ${{ inputs.operation != 'status' }}
        with:
          ref: ${{ github.sha }}
          path: .runner-1-6/control-release
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/runner-1-6/
            /02_platform_pingtai/infrastructure/release/
            /04_tools/release-engine/
            /scripts/runner-1-6.sh
      - name: Prepare shared release core
        if: ${{ inputs.operation != 'status' }}
        uses: ./.runner-1-6/control-release/.github/actions/runner-1-6
        with:
          phase: prepare
          operation: ${{ inputs.operation }}
          source-sha: ${{ needs.route.outputs.source_sha }}
          target: ${{ inputs.release_target }}
          instance-path: ${{ inputs.instance_path }}
          runner-class: ${{ needs.route.outputs.runner_class }}
          control-root: ${{ github.workspace }}/.runner-1-6/control-release
      - name: Prepare live status core
        if: ${{ inputs.operation == 'status' }}
        uses: ./.runner-1-6/status-control/.github/actions/runner-1-6
        with:
          phase: prepare
          operation: status
          runner-class: ${{ needs.route.outputs.runner_class }}
          control-root: ${{ github.workspace }}/.runner-1-6/status-control
      - name: Mark shared release core started
        id: started
        shell: bash
        run: echo 'value=true' >> "$GITHUB_OUTPUT"
      - name: Run shared release core
        if: ${{ inputs.operation != 'status' }}
        uses: ./.runner-1-6/control-release/.github/actions/runner-1-6
        with:
          phase: run
          operation: ${{ inputs.operation }}
          identifier: ${{ inputs.identifier }}
          source-sha: ${{ needs.route.outputs.source_sha }}
          target: ${{ inputs.release_target }}
          physical-node: ${{ inputs.physical_node }}
          instance-path: ${{ inputs.instance_path }}
          runner-class: ${{ needs.route.outputs.runner_class }}
          control-root: ${{ github.workspace }}/.runner-1-6/control-release
      - name: Read live status with the same core
        if: ${{ inputs.operation == 'status' }}
        uses: ./.runner-1-6/status-control/.github/actions/runner-1-6
        with:
          phase: run
          operation: status
          identifier: ${{ inputs.identifier }}
          source-sha: ${{ needs.route.outputs.source_sha }}
          runner-class: ${{ needs.route.outputs.runner_class }}
          control-root: ${{ github.workspace }}/.runner-1-6/status-control

  hosted-startup-fallback:
    name: Retry pre-core startup on GitHub Hosted
    needs: [route, execute]
    if: ${{ always() && needs.route.outputs.runner_class == 'self-hosted' && needs.execute.result == 'failure' && needs.execute.outputs.core_started != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ZDT_ARTIFACT_STORE: ${{ vars.ZDT_ARTIFACT_STORE || 'r2' }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ inputs.operation == 'status' }}
        with:
          ref: ${{ github.sha }}
          path: .runner-1-6/status-control
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/runner-1-6/
            /02_platform_pingtai/infrastructure/release/
            /04_tools/release-engine/
            /scripts/runner-1-6.sh
      - uses: actions/checkout@v6
        if: ${{ inputs.operation != 'status' }}
        with:
          ref: ${{ github.sha }}
          path: .runner-1-6/control-release
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/runner-1-6/
            /02_platform_pingtai/infrastructure/release/
            /04_tools/release-engine/
            /scripts/runner-1-6.sh
      - name: Prepare shared release core on Hosted
        if: ${{ inputs.operation != 'status' }}
        uses: ./.runner-1-6/control-release/.github/actions/runner-1-6
        with:
          phase: prepare
          operation: ${{ inputs.operation }}
          source-sha: ${{ needs.route.outputs.source_sha }}
          target: ${{ inputs.release_target }}
          instance-path: ${{ inputs.instance_path }}
          runner-class: github-hosted
          control-root: ${{ github.workspace }}/.runner-1-6/control-release
      - name: Prepare live status core on Hosted
        if: ${{ inputs.operation == 'status' }}
        uses: ./.runner-1-6/status-control/.github/actions/runner-1-6
        with:
          phase: prepare
          operation: status
          runner-class: github-hosted
          control-root: ${{ github.workspace }}/.runner-1-6/status-control
      - name: Mark shared release core started
        shell: bash
        run: echo 'value=true' >> "$GITHUB_OUTPUT"
      - name: Run the same release core after portable runner startup failure
        if: ${{ inputs.operation != 'status' }}
        uses: ./.runner-1-6/control-release/.github/actions/runner-1-6
        with:
          phase: run
          operation: ${{ inputs.operation }}
          identifier: ${{ inputs.identifier }}
          source-sha: ${{ needs.route.outputs.source_sha }}
          target: ${{ inputs.release_target }}
          physical-node: ${{ inputs.physical_node }}
          instance-path: ${{ inputs.instance_path }}
          runner-class: github-hosted
          control-root: ${{ github.workspace }}/.runner-1-6/control-release
      - name: Read live status with the same core after portable runner startup failure
        if: ${{ inputs.operation == 'status' }}
        uses: ./.runner-1-6/status-control/.github/actions/runner-1-6
        with:
          phase: run
          operation: status
          identifier: ${{ inputs.identifier }}
          source-sha: ${{ needs.route.outputs.source_sha }}
          runner-class: github-hosted
          control-root: ${{ github.workspace }}/.runner-1-6/status-control
