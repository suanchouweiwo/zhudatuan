name: Runner 1.7 shared release core
description: Runs the same release implementation on Aliyun or GitHub Hosted runners
inputs:
  phase:
    description: Prepare the runner or execute the shared core
    required: false
    default: run
  operation:
    required: true
  identifier:
    required: false
    default: ''
  source-sha:
    required: false
    default: ''
  target:
    required: false
    default: ''
  physical-node:
    required: false
    default: ''
  instance-path:
    description: Public instance snapshot directory within the selected Source SHA
    required: false
    default: ''
  runner-class:
    required: true
  control-root:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Use Node 22
      if: inputs.phase == 'prepare'
      uses: actions/setup-node@v6
      with:
        node-version: 22.22.0
    - name: Load R2 client dependencies
      if: inputs.phase == 'prepare' && (inputs.operation == 'release' || inputs.operation == 'retry') && env.ZDT_ARTIFACT_STORE == 'r2'
      shell: bash
      env:
        CONTROL_ROOT: ${{ inputs.control-root != '' && inputs.control-root || github.workspace }}
      run: npm ci --prefix "$CONTROL_ROOT/04_tools/release-engine" --ignore-scripts --no-audit --no-fund
    - name: Select exact Source checkout paths
      id: source_scope
      if: inputs.phase == 'prepare' && inputs.source-sha != '' && (inputs.operation == 'release' || inputs.operation == 'retry')
      shell: bash
      env:
        CONTROL_ROOT: ${{ inputs.control-root != '' && inputs.control-root || github.workspace }}
        RELEASE_TARGET: ${{ inputs.target }}
        INSTANCE_PATH: ${{ inputs.instance-path }}
      run: node "$CONTROL_ROOT/04_tools/release-engine/source-checkout-1-7.mjs" "$CONTROL_ROOT" "$RELEASE_TARGET" "$INSTANCE_PATH" >> "$GITHUB_OUTPUT"
    - name: Load exact source
      if: inputs.phase == 'prepare' && inputs.source-sha != '' && (inputs.operation == 'release' || inputs.operation == 'retry')
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source-sha }}
        path: .runner-1-6/source
        fetch-depth: 2
        sparse-checkout-cone-mode: false
        sparse-checkout: ${{ steps.source_scope.outputs.paths }}
    - name: Materialize full Source after reused sparse checkout
      if: inputs.phase == 'prepare' && inputs.source-sha != '' && (inputs.operation == 'release' || inputs.operation == 'retry') && steps.source_scope.outputs.paths == ''
      shell: bash
      run: git -C "$GITHUB_WORKSPACE/.runner-1-6/source" sparse-checkout disable
    - name: Run shared release core
      if: inputs.phase == 'run'
      shell: bash
      env:
        CONTROL_ROOT: ${{ inputs.control-root != '' && inputs.control-root || github.workspace }}
        SOURCE_ROOT: ${{ inputs.source-sha != '' && (inputs.operation == 'release' || inputs.operation == 'retry') && format('{0}/.runner-1-6/source', github.workspace) || '' }}
        RELEASE_IDENTIFIER: ${{ inputs.identifier }}
        RELEASE_TARGET: ${{ inputs.target }}
        PHYSICAL_NODE: ${{ inputs.physical-node }}
        INSTANCE_PATH: ${{ inputs.instance-path }}
        RUNNER_CLASS: ${{ inputs.runner-class }}
      run: |
        bash "$CONTROL_ROOT/scripts/runner-1-6.sh" "${{ inputs.operation }}"
